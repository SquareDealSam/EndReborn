name: Release

# Builds the mod and publishes the resulting jars to a GitHub Release.
# Runs automatically when a version tag (e.g. v0.1.0) is pushed, and can also
# be triggered manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.1.0)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Read mod metadata
        id: mod
        run: |
          VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
          NAME=$(grep "^archives_base_name=" gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mod.outputs.name }}-${{ steps.mod.outputs.version }}
          path: build/libs/${{ steps.mod.outputs.name }}-${{ steps.mod.outputs.version }}.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: EndReborn ${{ github.event.inputs.tag || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: build/libs/${{ steps.mod.outputs.name }}-${{ steps.mod.outputs.version }}.jar
